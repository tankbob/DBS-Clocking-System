version: "3.9"
services:
  dbs:
    build: .
    ports:
      - 8192:80
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=host.docker.internal
      - DB_DATABASE=dbs
      - DB_USERNAME=dbs
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=${APP_KEY}
  composer:
    build:
      context: .
      dockerfile: Dockerfile.composer
    working_dir: /app
    volumes:
      - .:/app
    entrypoint: /bin/bash
    stdin_open: true
    tty: true